name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write # Allow deletion of repository caches
    steps:
      - name: Delete repository caches
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
